version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ama_postgres
    environment:
      POSTGRES_DB: ama_db
      POSTGRES_USER: ama_user
      POSTGRES_PASSWORD: ama_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ama_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
